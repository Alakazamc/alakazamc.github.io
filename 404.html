<script>
(function(){
  var root = document.documentElement;
  function seasonOf(m){
    if (m >= 3 && m <= 5) return 'spring';
    if (m >= 6 && m <= 8) return 'summer';
    if (m >= 9 && m <= 11) return 'autumn';
    return 'winter';
  }
  var now = new Date();
  root.dataset.season = seasonOf(now.getMonth() + 1);
  var h = now.getHours();
  root.dataset.time = (h < 6 || h >= 18) ? 'night' : 'day';
})();
</script><script>(function runtime(cfg) {
  var root = document.documentElement;
  var buttons = document.querySelectorAll('[data-set-skin]');
  function apply(value) {
    // Swap both text and surfaces together; the old seasonal background tween
    // otherwise leaves light text on a light surface during dark-skin changes.
    root.classList.add('skin-changing');
    root.dataset.skin = value;
    buttons.forEach(function (button) { button.setAttribute('aria-pressed', String(button.dataset.setSkin === value)); });
    document.dispatchEvent(new CustomEvent('kx:skin', {detail: value}));
    requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.remove('skin-changing'); }); });
  }
  buttons.forEach(function (button) {
    button.addEventListener('click', function () {
      var value = button.dataset.setSkin;
      apply(value);
      try { localStorage.setItem('kx-skin', value); } catch (_) {}
    });
  });
  apply(root.dataset.skin);
  function commentsTheme() {
    // 评论区主题跟皮肤与昼夜（第 6.12 节）：cfg 是 palette.js giscusThemes() 的 8 个地址
    var theme = cfg[root.dataset.skin + '-' + (root.dataset.time === 'night' ? 'night' : 'day')];
    var client = document.querySelector('script[src="https://giscus.app/client.js"]');
    if (client) client.dataset.theme = theme;
    var frame = document.querySelector('iframe.giscus-frame');
    if (frame) frame.contentWindow.postMessage({giscus: {setConfig: {theme: theme}}}, 'https://giscus.app');
  }
  commentsTheme();
  new MutationObserver(commentsTheme).observe(root, {attributes:true, attributeFilter:['data-skin','data-time']});
  // 评论区是懒加载 iframe：它还没启动完时发出的 setConfig 会丢（线上实测换皮肤后评论区停在旧主题）。
  // giscus 第一次回消息（resizeHeight）时它的监听已经挂好，这时补发一次当前主题；之后的切换直接生效。
  var commentsReady = false;
  addEventListener('message', function (event) {
    if (event.origin !== 'https://giscus.app' || commentsReady) return;
    commentsReady = true;
    commentsTheme();
  });
})({"sakura-day":"https://alakazamc.github.io/assets/giscus/sakura-day.css?v=79d0088f3b","sakura-night":"https://alakazamc.github.io/assets/giscus/sakura-night.css?v=79d0088f3b","coast-day":"https://alakazamc.github.io/assets/giscus/coast-day.css?v=79d0088f3b","coast-night":"https://alakazamc.github.io/assets/giscus/coast-night.css?v=79d0088f3b","observatory-day":"https://alakazamc.github.io/assets/giscus/observatory-day.css?v=79d0088f3b","observatory-night":"https://alakazamc.github.io/assets/giscus/observatory-night.css?v=79d0088f3b","farm-day":"https://alakazamc.github.io/assets/giscus/farm-day.css?v=79d0088f3b","farm-night":"https://alakazamc.github.io/assets/giscus/farm-night.css?v=79d0088f3b"});(function(){
  var scenes=Array.from(document.querySelectorAll('.skin-diorama'));
  if(!scenes.length)return;
  var stage=document.querySelector('[data-stage]'),visible=new Set();
  function pause(){scenes.forEach(function(scene){scene.dataset.scenePaused=String(document.hidden||!visible.has(scene)||stage.dataset.paused==='true');});}
  var button=stage.querySelector('[data-stage-pause]'),reduced=matchMedia('(prefers-reduced-motion: reduce)');
  var setPaused=function(value){stage.dataset.paused=String(value);button.setAttribute('aria-pressed',String(value));button.textContent=value?'继续风景':'暂停风景';pause();};
  setPaused(reduced.matches);
  button.addEventListener('click',function(){setPaused(stage.dataset.paused!=='true');});
  reduced.addEventListener('change',function(event){setPaused(event.matches);});
  var observer=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting)visible.add(entry.target);else visible.delete(entry.target);});pause();},{threshold:0.05});
  scenes.forEach(function(scene){observer.observe(scene);});
  document.addEventListener('visibilitychange',pause);
})();</script>
